[package]
name = "supportos"
version = "1.0.0"
description = "SupportOS - local-first AI-powered support operating system for Help Scout"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "supportos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
