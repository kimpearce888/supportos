name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve for support teams?
      description: Describe the workflow or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would the ideal behavior look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety considerations
      options:
        - label: This does not weaken the safety model (no automatic sending, no data leaving the machine, no bypass of write protection)
          required: true
