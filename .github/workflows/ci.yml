name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit + Integration + E2E tests
        run: npm run test:all

      - name: Production build
        run: npm run build

      - name: Smoke test (server boots in demo mode)
        run: |
          cp .env.example .env
          PORT=3999 timeout 25 node dist/server/index.js & sleep 8
          curl -sf http://127.0.0.1:3999/api/health > /dev/null && echo "HEALTH OK"
