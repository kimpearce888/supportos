name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Build, Test, Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (strict)
        run: npm run typecheck

      # E2E tests boot the real server and expect the built SPA in dist/client,
      # so the production build must exist before running the suite.
      - name: Production build
        run: npm run build

      - name: Unit + Integration + E2E tests
        run: npm run test:all

      - name: Smoke test (server boots in demo mode)
        run: |
          LOCAL_DEMO_MODE=true PORT=3999 HOST=127.0.0.1 timeout 25 node dist/server/index.js & sleep 8
          curl -sf http://127.0.0.1:3999/health | tee /dev/stderr | rg -q '"status":"ok"' && echo "HEALTH OK"
